server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Explicit Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[2].id=doctor-service
spring.cloud.gateway.routes[2].uri=lb://doctor-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/doctors/**

spring.cloud.gateway.routes[3].id=appointment-service
spring.cloud.gateway.routes[3].uri=lb://appointment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/appointments/**

spring.cloud.gateway.routes[4].id=consultation-service
spring.cloud.gateway.routes[4].uri=lb://consultation-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/consultations/**

spring.cloud.gateway.routes[5].id=prescription-service
spring.cloud.gateway.routes[5].uri=lb://prescription-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/prescriptions/**

spring.cloud.gateway.routes[6].id=medicine-service
spring.cloud.gateway.routes[6].uri=lb://medicine-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/medicines/**

spring.cloud.gateway.routes[7].id=medication-service
spring.cloud.gateway.routes[7].uri=lb://medicine-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/medications/**

spring.cloud.gateway.routes[8].id=pharmacy-service
spring.cloud.gateway.routes[8].uri=lb://pharmacy-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/pharmacy/**

spring.cloud.gateway.routes[9].id=ambulance-service-emergency
spring.cloud.gateway.routes[9].uri=lb://ambulance-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/emergency/**

spring.cloud.gateway.routes[10].id=ambulance-service-ambulances
spring.cloud.gateway.routes[10].uri=lb://ambulance-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/ambulances/**

spring.cloud.gateway.routes[11].id=ambulance-service-operator
spring.cloud.gateway.routes[11].uri=lb://ambulance-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/ambulance/**

spring.cloud.gateway.routes[12].id=notification-service
spring.cloud.gateway.routes[12].uri=lb://notification-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/notifications/**

# WebRTC signaling only; audio/video remains peer-to-peer between browsers.
spring.cloud.gateway.routes[13].id=consultation-websocket
spring.cloud.gateway.routes[13].uri=lb:ws://consultation-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/ws/consultations

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_URL:http://localhost:3000}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
