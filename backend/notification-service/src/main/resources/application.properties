server.port=${SERVER_PORT:8090}
spring.application.name=notification-service
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rhc_notifications?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATION_KAFKA_GROUP_ID:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
notification.kafka.topic=${NOTIFICATION_KAFKA_TOPIC:rhc.notification.events}
notification.kafka.admin.enabled=${NOTIFICATION_KAFKA_ADMIN_ENABLED:true}
notification.scheduler.enabled=${NOTIFICATION_SCHEDULER_ENABLED:true}

jwt.secret=${JWT_SECRET}
firebase.enabled=${FCM_ENABLED:false}
firebase.project-id=${FIREBASE_PROJECT_ID:}

management.endpoints.web.exposure.include=health,info
