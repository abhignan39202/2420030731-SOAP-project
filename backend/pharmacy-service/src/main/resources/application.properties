server.port=8088
spring.application.name=pharmacy-service

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/rhc_pharmacy?createDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

jwt.secret=${JWT_SECRET}
pharmacy.seed-data.enabled=${PHARMACY_SEED_DATA_ENABLED:false}

# Nearby pharmacy discovery is provider-backed. Keep keys on the backend only.
nearby.pharmacy.provider=${NEARBY_PHARMACY_PROVIDER:osm}
nearby.pharmacy.default-radius-meters=${NEARBY_PHARMACY_RADIUS_METERS:5000}
nearby.pharmacy.osm.endpoint=${OSM_OVERPASS_ENDPOINT:https://overpass-api.de/api/interpreter}
nearby.pharmacy.osm.fallback-endpoint=${OSM_OVERPASS_FALLBACK_ENDPOINT:https://lz4.overpass-api.de/api/interpreter}
nearby.pharmacy.google.endpoint=${GOOGLE_PLACES_ENDPOINT:https://maps.googleapis.com/maps/api/place/nearbysearch/json}
nearby.pharmacy.google.api-key=${GOOGLE_PLACES_API_KEY:}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
notification.kafka.enabled=${NOTIFICATION_KAFKA_ENABLED:false}
notification.kafka.topic=${NOTIFICATION_KAFKA_TOPIC:rhc.notification.events}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
