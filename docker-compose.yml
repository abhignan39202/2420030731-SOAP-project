services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be configured}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  mysql-provisioner:
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be configured}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_PROTOCOL: tcp
    volumes:
      - ./backend/mysql/init:/docker-entrypoint-initdb.d:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-initdb.d/01-create-service-databases.sh"]

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  eureka-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
    ports:
      - "8081:8081"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_auth?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}

  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    ports:
      - "8082:8082"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_users?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}

  doctor-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: doctor-service
    ports:
      - "8083:8083"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_doctors?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}

  appointment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: appointment-service
    ports:
      - "8084:8084"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_appointments?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_KAFKA_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}

  consultation-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: consultation-service
    ports:
      - "8085:8085"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_consultations?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}

  prescription-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: prescription-service
    ports:
      - "8086:8086"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_prescriptions?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_KAFKA_ENABLED: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vision.json
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
    volumes:
      - ./secrets/google-vision.json:/run/secrets/google-vision.json:ro

  medicine-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: medicine-service
    ports:
      - "8087:8087"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_medicines?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      MEDICINE_SEED_DATA_ENABLED: ${MEDICINE_SEED_DATA_ENABLED:-false}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_KAFKA_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}

  pharmacy-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: pharmacy-service
    ports:
      - "8088:8088"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_pharmacy?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_KAFKA_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      NEARBY_PHARMACY_PROVIDER: ${NEARBY_PHARMACY_PROVIDER:-osm}
      NEARBY_PHARMACY_RADIUS_METERS: ${NEARBY_PHARMACY_RADIUS_METERS:-5000}
      OSM_OVERPASS_ENDPOINT: ${OSM_OVERPASS_ENDPOINT:-https://overpass-api.de/api/interpreter}
      OSM_OVERPASS_FALLBACK_ENDPOINT: ${OSM_OVERPASS_FALLBACK_ENDPOINT:-https://lz4.overpass-api.de/api/interpreter}
      GOOGLE_PLACES_ENDPOINT: ${GOOGLE_PLACES_ENDPOINT:-https://maps.googleapis.com/maps/api/place/nearbysearch/json}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      PHARMACY_SEED_DATA_ENABLED: ${PHARMACY_SEED_DATA_ENABLED:-false}

  ambulance-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: ambulance-service
    ports:
      - "8089:8089"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_ambulance?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      AMBULANCE_SEED_DATA_ENABLED: ${AMBULANCE_SEED_DATA_ENABLED:-false}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_KAFKA_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    ports:
      - "8090:8090"
    depends_on:
      mysql-provisioner:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8090
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rhc_notifications?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: rhc_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be configured}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_KAFKA_TOPIC: ${NOTIFICATION_KAFKA_TOPIC:-rhc.notification.events}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}

volumes:
  mysql-data:
